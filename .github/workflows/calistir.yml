name: Rapor Calistirici

on:
  workflow_dispatch:

jobs:
  rapor_olustur:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Sürüm güncellendi

      - name: Gerekli Kütüphaneleri Kur
        run: pip install google-genai # Kütüphane güncellendi

      - name: Rapor Betiğini Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python rapor_uret.py

      - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Yapay Zeka ile günlük rapor eklendi" || echo "Değişiklik yok"
          git push
