<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piyasa Bülteni | Arşiv</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0b1c31;
            --accent: #c5a059;
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .header {
            background: var(--primary);
            padding: 70px 20px;
            text-align: center;
            color: white;
            border-bottom: 5px solid var(--accent);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 18px;
            color: #cbd5e0;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            max-width: 800px;
            margin: -40px auto 60px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .report-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-decoration: none;
            color: var(--text-main);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .report-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            border-left-color: var(--accent);
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .date-badge {
            background: #edf2f7;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-weight: 500;
            font-size: 17px;
        }
        .card-arrow {
            color: var(--accent);
            font-weight: bold;
            font-size: 22px;
            transition: transform 0.3s ease;
        }
        .report-card:hover .card-arrow {
            transform: translateX(6px);
        }
        @media (max-width: 600px) {
            .card-left { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Global Markets</h1>
        <p>Kurumsal kalitede, günlük finansal analiz ve makro strateji raporları arşivi.</p>
    </div>
    
    <div class="container">
        <div class="report-list">

            <a href='raporlar/2026-08-31.html' class="report-card">
                <div class="card-left">
                    <span class="date-badge">2026-08-31</span>
                    <span class="card-title">Günlük Piyasa Analizi</span>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a href='raporlar/2026-08-30.html' class="report-card">
                <div class="card-left">
                    <span class="date-badge">2026-08-30</span>
                    <span class="card-title">Günlük Piyasa Analizi</span>
                </div>
                <span class="card-arrow">→</span>
            </a>

        </div>
    </div>
</body>
</html>
